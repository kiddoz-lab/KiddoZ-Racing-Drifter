<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiddoZ Racing Drifter | Home</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body class="home-screen">
    <div id="transition-overlay"></div>
    <div class="background-animation"></div>
    
    <main class="menu-container">
        <header class="menu-header">
            <div class="logo-container">
                <span class="logo-k">K</span>
                <span class="logo-text">iddoZ</span>
            </div>
            <h1 class="menu-title">Racing <span class="highlight">Drifter</span></h1>
        </header>

        <nav class="main-menu">
            <a href="play/" class="menu-item" data-page="play">
                <span class="menu-label">Play</span>
                <span class="menu-hint">Enter the Lab</span>
            </a>
            <a href="customize/" class="menu-item" data-page="customize">
                <span class="menu-label">Customize</span>
                <span class="menu-hint">Tune your ride</span>
            </a>
            <a href="settings/" class="menu-item" data-page="settings">
                <span class="menu-label">Settings</span>
                <span class="menu-hint">Preferences</span>
            </a>
            <a href="credits/" class="menu-item" data-page="credits">
                <span class="menu-label">Credits</span>
                <span class="menu-hint">The Team</span>
            </a>
        </nav>

        <footer class="footer home-footer">
            <p>&copy; 2026 KiddoZ Lab. All Rights Reserved.</p>
        </footer>
    </main>

    <script src="src/transitions.js"></script>
</body>
</html>
