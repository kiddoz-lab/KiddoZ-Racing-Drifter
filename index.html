<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiddoZ Racing Drifter | Coming Soon</title>
    <link rel="stylesheet" href="src/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="background-animation"></div>

    <main class="container">
        <header class="hero">
            <div class="logo-container">
                <span class="logo-k">K</span>
                <span class="logo-text">iddoZ</span>
            </div>
            <h1 class="title">Racing <span class="highlight">Drifter</span></h1>
            <p class="subtitle">Experience the ultimate drift. Built by the next generation.</p>
        </header>

        <section class="status-card glass">
            <div class="status-header">
                <span class="status-dot pulse"></span>
                <span class="status-text">Engine Warming Up</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="status-description">Initializing physics engine and high-fidelity graphics...</p>
        </section>

        <footer class="footer">
            <p>&copy; 2026 KiddoZ Lab. High-Performance Racing & Drifting.</p>
            <div class="links">
                <a href="LICENSE" class="link">License</a>
                <a href="https://github.com/kiddoz-lab/KiddoZ-Racing-Drifter" class="link">GitHub</a>
            </div>
        </footer>
    </main>
    <script src="src/vector.js"></script>
    <script src="src/car.js"></script>
    <script src="src/script.js"></script>
</body>

</html>
